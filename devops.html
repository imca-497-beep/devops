<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main heading of the page -->
    <h1>Welcome to My Website</h1>

    <!-- A simple paragraph with text formatting -->
    <p>This is a paragraph of text. You can make text <strong>bold</strong> or <em>italicized</em> easily.</p>

    <!-- An example of an image (replace URL with your own image) -->
    <img src="https://placeholder.com" alt="A descriptive placeholder image" width="150" height="150">

    <!-- An example of a hyperlink -->
    <p>Visit the official <a href="https://www.w3schools.com" target="_blank">W3Schools Website</a> for more tutorials.</p>

    <!-- An unordered list -->
    <h2>My Favorite Things</h2>
    <ul>
        <li>Coding with HTML</li>
        <li>Designing layouts</li>
        <li>Learning new skills</li>
    </ul>

</body>
</html>
